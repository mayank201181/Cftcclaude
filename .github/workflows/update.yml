name: Update CFTC dashboard

on:
  schedule:
    # CFTC publishes Fridays 15:30 ET (positions as of Tuesday). First run is
    # Sat ~05:20 SGT, a retry Sat afternoon SGT, and a Monday-evening ET run
    # catches holiday-delayed releases.
    - cron: "23 21 * * 5"
    - cron: "23 7 * * 6"
    - cron: "23 22 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Re-download the full history
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths: ["cftc/**", "web/**", "tests/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cftc-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # main publishes to `data`; any other branch builds into `data-dev` so
      # development runs never overwrite what the live dashboard reads.
      DATA_BRANCH: ${{ github.ref_name == 'main' && 'data' || 'data-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Restore data store
        run: |
          mkdir -p datastore
          for b in "$DATA_BRANCH" data; do
            if git fetch --depth=1 origin "+refs/heads/$b:refs/remotes/origin/$b"; then
              git archive "origin/$b" | tar -x -C datastore
              echo "Restored from $b"
              break
            fi
          done
      - name: Fetch CFTC reports and prices
        run: python -m cftc fetch --store datastore ${{ inputs.full && '--full' || '' }}
      - name: Build dashboard
        run: python -m cftc build --store datastore
      - name: Probe candidate sources
        if: github.ref_name != 'main'
        continue-on-error: true
        run: python -m cftc.probe datastore/probe
      - name: Save data store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd datastore
          rm -rf .git
          git init -q -b "$DATA_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ) (${GITHUB_REF_NAME}@${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DATA_BRANCH"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: datastore/site

  # Optional public copy on GitHub Pages: set Pages to "GitHub Actions" in the
  # repo settings and add a repository variable PAGES_ENABLED=true.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
